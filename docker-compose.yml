# ══════════════════════════════════════════════════════════════════
#  NetShield AI Platform — Docker Compose
#  Starts: Backend (FastAPI) + Frontend (Next.js) + MongoDB
# ══════════════════════════════════════════════════════════════════

version: "3.9"

services:

  # ─────────────────────────────────────────────
  #  PostgreSQL — User & Auth Database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: netshield_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Ankan}
      POSTGRES_DB: ${POSTGRES_DB:-netshield}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netshield_net

  # ─────────────────────────────────────────────
  #  MongoDB — Primary data store
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: netshield_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: netshield_logs
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - netshield_net

  # ─────────────────────────────────────────────
  #  Backend — FastAPI + ML Engine
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netshield_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB=netshield_logs
      - SECRET_KEY=${SECRET_KEY:-netshield_supersecret_change_in_production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - PYTHONUNBUFFERED=1
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Ankan}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-netshield}
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - netshield_net

  # ─────────────────────────────────────────────
  #  Frontend — Next.js Dashboard
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netshield_frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://52.66.252.155:8000
      - PORT=3001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - netshield_net

# ─────────────────────────────────────────────
#  Volumes & Networks
# ─────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  postgres_data:
    driver: local

networks:
  netshield_net:
    driver: bridge
