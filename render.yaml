databases:
  - name: netshield-db
    plan: free
    region: ohio

services:
  # 1. FastAPI Backend
  - type: web
    name: netshield-backend
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: netshield-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        value: "https://netshield-frontend.onrender.com,https://netshield-frontend-pwre.onrender.com"

  # 2. React Frontend
  - type: web
    name: netshield-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://netshield-backend-vb0u.onrender.com"
      - key: VITE_API_V1_STR
        value: "/api/v1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
